<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="SentinelAI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="gV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="gS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c3e6"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowSm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="tD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="gVd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4338ca"/></linearGradient><linearGradient id="gSd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs>
<g class="emblem">
  <circle cx="110" cy="110" r="105" fill="url(#halo)"/>
  <!-- mesh -->
  <g stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.4" fill="none">
    <path d="M110 22 L66 58 L34 118 M110 22 L150 58 L186 100 M66 58 L150 58 M66 58 L60 130 L110 200 M150 58 L160 160 L110 200 M60 130 L160 160 M34 118 L60 130 M186 100 L160 160 M110 200 L70 176 L60 130"/>
  </g>
  <!-- outer open hexagon (two halves = S silhouette) -->
  <g fill="none" stroke="url(#gV)" stroke-width="11" stroke-linejoin="miter" stroke-linecap="butt" filter="url(#glow)">
    <path d="M192 72 L110 20 L30 68 L30 124"/>
    <path d="M190 96 L190 156 L110 204 L28 160"/>
  </g>
  <!-- inner S ribbon -->
  <path d="M146 78 H92 L80 90 V102 L92 114 H130 L142 126 V138 L130 150 H74" fill="none" stroke="url(#gS)" stroke-width="15" stroke-linejoin="miter" stroke-linecap="butt" filter="url(#glow)"/>
  <path d="M146 78 H92 L80 90 V102 L92 114 H130 L142 126 V138 L130 150 H74" fill="none" stroke="#ede9fe" stroke-opacity=".55" stroke-width="2.5" stroke-linejoin="miter"/>
  <!-- nodes -->
  <g fill="#ede9fe" filter="url(#glowSm)">
    <circle cx="110" cy="22" r="5"/><circle cx="66" cy="58" r="4"/><circle cx="34" cy="118" r="4"/>
    <circle cx="60" cy="130" r="4"/><circle cx="160" cy="160" r="4"/><circle cx="110" cy="200" r="5"/><circle cx="70" cy="176" r="3.5"/>
  </g>
  <!-- anomaly node -->
  <circle cx="150" cy="58" r="5.5" fill="#fb7185" filter="url(#glowSm)"/>
  <circle cx="150" cy="58" r="10" fill="none" stroke="#fb7185" stroke-opacity=".5" stroke-width="1.5"/>
</g>
</svg>